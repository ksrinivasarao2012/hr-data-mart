# ---------------------------------------------------------------------------
# Minimal stack for a one-night build:
#   postgres_app  -> the HR data mart (YOUR data lives here)
#   postgres_meta -> Airflow's own metadata DB (keep it separate from your data)
#   airflow       -> LocalExecutor, standalone-ish single container
#
# Deliberately NOT using the full official compose (which spawns 7 containers
# incl. redis + celery workers). You do not need CeleryExecutor for this.
# ---------------------------------------------------------------------------

services:

  postgres_app:
    image: postgres:16-alpine
    container_name: hr_postgres_app
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_pass
      POSTGRES_DB: hr_mart
    ports:
      - "5433:5432"          # host port 5433 -> avoids clashing with a local Postgres
    volumes:
      - pg_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_mart"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_meta:
    image: postgres:16-alpine
    container_name: hr_postgres_meta
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build: .
    container_name: hr_airflow
    depends_on:
      postgres_meta:
        condition: service_healthy
      postgres_app:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_meta:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

      # --- connection details your scripts and dbt profile read -------------
      APP_DB_HOST: postgres_app
      APP_DB_PORT: "5432"
      APP_DB_USER: hr_user
      APP_DB_PASSWORD: hr_pass
      APP_DB_NAME: hr_mart

      # --- LLM key, read from your local .env file --------------------------
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./scripts:/opt/airflow/scripts
      - ./eval:/opt/airflow/eval
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: standalone

volumes:
  pg_app_data:
  pg_meta_data:
  airflow_logs:
